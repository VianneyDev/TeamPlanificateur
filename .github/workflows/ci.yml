name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Docker baselines for review and commit
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    env:
      # Build imports Prisma at module load; no live DB required for quality checks.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter eccentric-equinox exec prisma generate

      - name: Workspace contract
        run: pnpm test:workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: UI unit tests
        run: pnpm test:ui

      - name: Build
        run: pnpm build

      - name: Built-server CSRF tests
        run: pnpm test:ssr

  storybook_build:
    name: Build Storybook
    if: |
      github.event_name == 'workflow_dispatch' || (
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @vianneytraina/ui build-storybook

      - name: Upload static Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static/
          if-no-files-found: error
          retention-days: 1

  storybook_test:
    name: Storybook visual and accessibility
    needs: storybook_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download static Storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static

      - name: Compare screenshots and run axe
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
        run: pnpm test:storybook

      - name: Regenerate screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: pnpm test:storybook --update-snapshots

      - name: Commit regenerated screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add tests/storybook.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "Snapshots are already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test: update Storybook visual snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload regenerated screenshots
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual-snapshots
          path: tests/storybook.spec.mjs-snapshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: API tests (Neon)
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get branch expiration date (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Generate Prisma client
        run: pnpm --filter eccentric-equinox exec prisma generate

      - name: Apply Prisma migrations (direct / unpooled URL)
        run: pnpm --filter eccentric-equinox exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}

      - name: Write .env.test for Vitest
        run: |
          umask 077
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > apps/web/.env.test
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}

  delete_neon_branch:
    name: Delete Neon Branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
